---
layout: default
---
<article class="post">
  <header>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  <div class="prose">{{ content }}</div>
  <a class="more" href="{{ '/blog/' | relative_url }}">← All posts</a>
</article>
