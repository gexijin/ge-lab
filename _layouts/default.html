<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="{{ '/' | relative_url }}">Ge Lab</a>
      <nav>
        {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>© {{ site.time | date: "%Y" }} Ge Lab</span>
      <span class="links">
        {% for link in site.social %}<a href="{{ link.url }}">{{ link.title }}</a>{% endfor %}
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </span>
    </div>
  </footer>
</body>
</html>
